# ============================================================
# TARGET COMPANIES — polled directly via their ATS public APIs
# Add/remove freely. ats: greenhouse | lever | ashby | workable
# board_token = the company slug in their careers URL.
# enabled: false = keep in list but stop polling.
# ============================================================

companies:
