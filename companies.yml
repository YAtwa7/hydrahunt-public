# Companies to never show (user blacklist, managed from dashboard)
blacklist:
  - Testlio        # talent-pool gig platform — blocked by user
  - Applause       # same shit, different logo
  - uTest          # Applause's gig brand

# US-only employers — remote WITHIN the US or clearance-gated. User rule:
# "remote from USA is BS". Postings may just say "Remote" with no clue;
# the company itself is the tell. Add companies here as they surface.
us_only:
  - CACI                    # US defense contractor — clearance/US-citizen
  - Koniag                  # US gov contractor (Alaska Native-owned)
  - Amwell                  # US telehealth
  - Geneoscopy              # US biotech
  - Bright Vision Technologies
  - Blueprint Technologies
  - Ace IT Careers          # US staffing funnel for US employers
  - Sargent & Lundy         # US nuclear/energy engineering
