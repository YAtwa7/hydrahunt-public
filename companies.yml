  # --- AI-product companies (matches GenAI-testing niche) ---
  - { name: Anthropic, ats: greenhouse, board_token: anthropic }
  - { name: Cohere, ats: ashby, board_token: cohere }
  - { name: Scale AI, ats: greenhouse, board_token: scaleai }
