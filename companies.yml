  - { name: BrowserStack, ats: greenhouse, board_token: browserstack }
  - { name: LambdaTest, ats: greenhouse, board_token: lambdatest }
  - { name: Katalon, ats: greenhouse, board_token: katalon }
  - { name: Tricentis, ats: greenhouse, board_token: tricentis }
  - { name: SmartBear, ats: greenhouse, board_token: smartbear }
  - { name: mabl, ats: greenhouse, board_token: mabl }
  - { name: Applitools, ats: lever, board_token: applitools }
  - { name: Testlio, ats: greenhouse, board_token: testlio }
  - { name: "Global App Testing", ats: greenhouse, board_token: globalapptesting }
  - { name: Postman, ats: greenhouse, board_token: postman }
  - { name: Sauce Labs, ats: greenhouse, board_token: saucelabs }

  # --- Remote-from-anywhere (Egypt-compatible by policy) ---
  - { name: GitLab, ats: greenhouse, board_token: gitlab }
  - { name: Canonical, ats: greenhouse, board_token: canonical }
  - { name: Automattic, ats: ashby, board_token: automattic }
  - { name: Doist, ats: ashby, board_token: doist }
